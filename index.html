<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intel Panel - arex.my.id</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>AREX INTEL DASHBOARD</h2>

    <div class="card">
      <!-- State 1: Belum Login -->
      <div id="loginState">
        <h3>Autentikasi Pengguna</h3>
        <p class="subtext">Login dengan Discord untuk menghubungkan akun kamu secara otomatis.</p>
        <a href="/api/auth/login" class="btn btn-discord">Login with Discord</a>
      </div>

      <!-- State 2: Sudah Login -->
      <div id="appState" style="display: none;">
        <div class="user-profile">
          <img id="userAvatar" src="" alt="Avatar">
          <div>
            <div id="userName" class="username">Username</div>
            <span class="badge">Connected</span>
          </div>
        </div>

        <hr style="border: 0.5px solid #334155; margin: 16px 0;">

        <h3>Buat Link Masking (arex.my.id)</h3>
        <p class="subtext">Masukkan URL tujuan asli (misal: youtube.com).</p>

        <div class="input-group">
          <input id="targetUrl" type="text" placeholder="URL Tujuan (contoh: youtube.com)">
          <button class="btn btn-danger" onclick="generateMaskedLink()">Bikin Link</button>
        </div>

        <div id="resLogger" class="result-box">
          Siap membuat link tracking.
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
