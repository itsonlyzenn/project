<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREX INTEL DASHBOARD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. TAMPILAN SAAT BELUM LOGIN -->
  <div id="loginState" class="login-wrapper" style="display: none;">
    <div class="login-card">
      <h2>AREX INTEL DASHBOARD</h2>
      <p>Autentikasi Pengguna</p>
      <p class="sub-text">Login dengan Discord untuk menghubungkan akun kamu secara otomatis.</p>
      <a href="/api/auth/login" class="btn-discord">
        Login with Discord
      </a>
    </div>
  </div>

  <!-- 2. TAMPILAN DASHBOARD UTAMA (SETELAH LOGIN) -->
  <div id="appState" class="dashboard-wrapper" style="display: none;">
    <header class="dashboard-header">
      <div class="user-info">
        <img id="userAvatar" src="" alt="Avatar" class="avatar">
        <span id="userName">User</span>
      </div>
      <button onclick="logout()" class="btn-logout">Logout</button>
    </header>

    <main class="dashboard-content">
      <h2>AREX INTEL DASHBOARD</h2>
      
      <div class="input-group">
        <input type="text" id="targetUrl" placeholder="Masukkan URL target (cth: https://google.com)">
        <button onclick="generateMaskedLink()" class="btn-danger">Bikin Link</button>
      </div>
      <div id="resLogger" class="result-box"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
